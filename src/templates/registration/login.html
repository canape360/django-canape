{% extends "base.html" %}
{% load socialaccount %}

{% block title %}ログイン | Django Canape{% endblock %}

{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <h1 class="auth-title">ログイン</h1>

    <form method="post" class="auth-form">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="auth-button">ログイン</button>
    </form>

    <div class="auth-note" style="margin: 1.2rem 0 0.8rem; text-align: center;">または</div>

    <a href="{% provider_login_url 'github' next=request.GET.next %}"
   class="auth-button"
   style="display: block; box-sizing: border-box; width: 100%; text-align: center; text-decoration: none;">
  GitHubでログイン
</a>

    {% if request.GET.next %}
      <div class="auth-note">ログイン後に元のページへ戻ります</div>
    {% endif %}
  </div>
</div>
{% endblock %}
